apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: phi-chat-2
  namespace: llm-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: external
  labels:
    app.kubernetes.io/name: phi-chat-2
    app.kubernetes.io/part-of: llm-serving
spec:
  predictor:
    # Service account used by the serving pod.
    serviceAccountName: vllm-serving

    # Keep scheduling on your GPU node group.
    nodeSelector:
      gpu: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

    # Custom container runtime (vLLM OpenAI-compatible server).
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.25.1
        imagePullPolicy: IfNotPresent
        args:
          # Model path from warmed host cache mount.
          - /models/microsoft/phi-2/main
          # API model name clients send in requests.
          - --served-model-name
          - phi-2
          - --host
          - 0.0.0.0
          - --port
          - "8000"
          - --gpu-memory-utilization
          - "0.85"
          - --max-num-seqs
          - "16"

        ports:
          - name: http
            containerPort: 8000
            protocol: TCP

        resources:
          requests:
            cpu: "1200m"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2000m"
            memory: "7Gi"
            nvidia.com/gpu: "1"

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

    # Reuse node-local model cache prepared by your warmer daemonset.
    volumes:
      - name: model-cache
        hostPath:
          path: /var/lib/llm-model-cache
          type: Directory