apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: phi-chat-3
  namespace: llm-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
  labels:
    app.kubernetes.io/name: phi-chat-3
    app.kubernetes.io/part-of: llm-serving
spec:
  # Istio VirtualService will be used to send 25% traffic to the new revision created from this updated predictor.
  # Remaining 75% will be sent by Istio VirtualService to the previous ready revision.
  predictor:
    serviceAccountName: vllm-serving
    nodeSelector:
      eks.amazonaws.com/nodegroup: k8s-llm-serving-gpu-dev
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.25.1
        imagePullPolicy: IfNotPresent
        args:
          - /models/microsoft/Phi-3-mini-4k-instruct/main
          - --served-model-name
          - phi-3
          - --host
          - 0.0.0.0
          - --port
          - "8000"
          - --gpu-memory-utilization
          - "0.85"
          - --max-num-seqs
          - "16"

        ports:
          - name: http
            containerPort: 8000
            protocol: TCP

        resources:
          requests:
            cpu: "1200m"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "2000m"
            memory: "7Gi"
            nvidia.com/gpu: "1"

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6

        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true

    volumes:
      - name: model-cache
        hostPath:
          path: /var/lib/llm-model-cache
          type: Directory